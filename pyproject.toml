[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-rag"
version = "0.1.0"
description = "Minimal, offline retrieval-augmented search over a folder of Markdown notes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Akash Naickar" }]
keywords = ["rag", "retrieval", "markdown", "obsidian", "embeddings", "search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
obsidian-rag = "obsidian_rag.cli:main"

[project.urls]
Homepage = "https://github.com/AkashNaickar/ObsidianRAG"
Repository = "https://github.com/AkashNaickar/ObsidianRAG"
Issues = "https://github.com/AkashNaickar/ObsidianRAG/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=obsidian_rag --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["obsidian_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally assert broad exception types for validation paths.
"tests/*" = ["PT011"]
