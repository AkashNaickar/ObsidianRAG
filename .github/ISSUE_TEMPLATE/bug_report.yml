name: Bug report
description: Report a reproducible problem with ObsidianRAG.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands and, if possible, a minimal note folder.
      placeholder: |
        1. obsidian-rag ingest ./notes
        2. obsidian-rag query "..." 
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ObsidianRAG version
      placeholder: output of `obsidian-rag --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.4
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Logs, tracebacks, or configuration that may help.
    validations:
      required: false
