name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Test (with coverage gate)
        run: pytest

      - name: CLI smoke test
        run: |
          python -m obsidian_rag ingest examples/notes --index /tmp/obsidianrag-index --json
          python -m obsidian_rag query "paragraph packing and overlap for long blocks" \
            --index /tmp/obsidianrag-index -k 1
          python -m obsidian_rag stats --index /tmp/obsidianrag-index
